<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Método JAF</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Método JAF">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--az:#002F6C;--am:#FFDE59;--ro:#BC0F0C;--ne:#000;--gr:#9EAAB1;--c1:#141414;--c2:#1f1f1f;--bd:#262626;--ok:#93C47D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#fff;font-family:Inter,system-ui,sans-serif;min-height:100%}
button{font-family:inherit;cursor:pointer}
a{color:var(--am)}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:calc(env(safe-area-inset-bottom) + 130px)}
.pad{padding:0 20px}
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 34px) 20px 12px}
.logo{display:flex;align-items:baseline;gap:8px}.logo b{font-family:Anton;font-size:30px;font-weight:400;letter-spacing:-1px}.logo span{font-family:Anton;font-size:13px;letter-spacing:2px;color:var(--gr)}
h1,.h1{font-family:Anton;font-weight:400;font-size:30px;margin:0;line-height:1.05}
.h2{font-family:Anton;font-weight:400;font-size:24px;line-height:1.1}
.lbl{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--gr);margin:18px 0 8px}
.muted{color:var(--gr);font-size:13px}
.card{background:var(--c1);border:1px solid var(--bd);border-radius:20px;padding:14px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.btn{width:100%;height:56px;border:none;border-radius:28px;background:var(--ro);color:#fff;font-weight:800;font-size:16px;letter-spacing:1px}
.btn.y{background:var(--am);color:#000}.btn.g{background:#25D366;color:#000}.btn.d{background:var(--c1);border:1px solid #333}
.btn:disabled{opacity:.5}
.ibtn{width:44px;height:44px;border-radius:22px;border:1px solid #2a2a2a;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.seg{display:grid;gap:3px;background:var(--c1);border-radius:22px;padding:4px;margin:0 20px}
.seg button{height:40px;border:none;border-radius:18px;background:none;color:#fff;font-size:13px;font-weight:600}
.seg button.on{background:var(--am);color:#000;font-weight:800}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 20px}
.chip{flex:0 0 auto;min-width:78px;height:62px;border-radius:16px;border:1px solid var(--bd);background:var(--c1);color:#fff;padding:8px 12px;text-align:left}
.chip b{display:block;font-size:15px}.chip small{font-size:11px;opacity:.85}
.chip.on{background:var(--ro);border-color:var(--ro)}.chip.ok small{color:var(--ok)}
.ex{display:flex;align-items:center;gap:12px;background:var(--c1);border:1px solid var(--bd);border-radius:18px;padding:12px;margin-bottom:8px;width:100%;color:#fff;text-align:left}
.ex .ic{width:46px;height:46px;border-radius:23px;border:2px solid var(--am);background:var(--c2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:Anton;color:var(--am)}
.ex.done .ic{background:var(--ok);border-color:var(--ok);color:#000}
.ex .nm{font-weight:700;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:9px;background:var(--ro);color:#fff;margin-top:4px;margin-right:4px}
.tag.y{background:var(--am);color:#000}.tag.b{background:var(--az)}
.grp{border:1px dashed #555;border-radius:20px;padding:8px 8px 0;margin-bottom:8px}
.grp>.muted{padding:0 6px 6px;font-weight:800;letter-spacing:1px;font-size:11px;color:var(--am)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#0a0a0a;border-top:1px solid #1f1f1f;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(env(safe-area-inset-bottom) + 10px);z-index:20}
.nav button{background:none;border:none;color:var(--gr);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0}
.nav button.on{color:var(--am);font-weight:800}
.nav svg{width:24px;height:24px}
.scale{display:grid;gap:5px}
.scale button{height:44px;border-radius:12px;border:2px solid var(--c2);background:var(--c2);color:#fff;font-weight:800;font-size:15px;padding:0}
.in{width:100%;height:50px;border-radius:14px;border:2px solid #333;background:var(--c2);color:#fff;font-size:20px;font-weight:700;text-align:center;font-family:inherit}
.in:focus{outline:none;border-color:#fff}
textarea.in{height:110px;font-size:15px;font-weight:500;text-align:left;padding:12px;resize:none}
.set{display:grid;grid-template-columns:54px 1fr 1fr 42px;gap:8px;align-items:center;margin-bottom:8px}
.sn{height:38px;border-radius:19px;border:1px solid #444;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:none;color:#fff}
.sn.cur{border:2px solid var(--am);color:var(--am)}.sn.ok{background:var(--am);color:#000;border-color:var(--am)}
.cell{height:48px;border-radius:14px;background:var(--c1);border:1px solid var(--bd);color:#fff;width:100%;padding:0;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.cell b{font-size:17px}.cell small{font-size:10px;color:var(--gr)}
.rp{width:38px;height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#000;justify-self:center}
.sheet{background:#111;border-top:1px solid var(--bd);border-radius:28px 28px 0 0;padding:14px 20px calc(env(safe-area-inset-bottom) + 20px);margin-top:16px}
.face{display:flex;align-items:center;gap:14px;border-radius:22px;padding:12px 14px}
.tmr{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 8px);z-index:40;max-width:456px;margin:0 auto;background:var(--az);border:2px solid var(--am);border-radius:18px;padding:8px 10px 8px 14px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
body.contmr #app{padding-top:76px}
.rest{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 12px);z-index:40;max-width:456px;margin:0 auto;background:var(--az);border:2px solid var(--am);border-radius:22px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.7)}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}.bar i{display:block;height:100%;background:var(--am)}
.sync{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 8px);z-index:45;font-size:11px;font-weight:800;padding:5px 10px;border-radius:12px;display:none}.sync.p{display:block;background:#3a2f00;color:var(--am);border:1px solid #6b5600}.sync.ok{display:block;background:#0f2a12;color:var(--ok);border:1px solid #2c5a30}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#222;border:1px solid #333;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:600;z-index:50;max-width:90%}
.load{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:80vh}
.load b{font-family:Anton;font-size:90px;font-weight:400;letter-spacing:-3px;line-height:.9}
.spin{width:28px;height:28px;border:3px solid #333;border-top-color:var(--am);border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.food{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #1f1f1f;font-size:14px}
.food b{color:var(--am);white-space:nowrap}
.q{min-width:62px;height:28px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.mac{border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.mac b{font-family:Anton;font-size:26px;font-weight:400;line-height:1}.mac span{font-size:11px;font-weight:800}
.empty{text-align:center;padding:40px 24px;color:var(--gr)}
</style>
</head>
<body>
<div id="app" class="wrap"><div class="load"><b>JA</b><div class="spin"></div></div></div>
<div id="ovl"></div><div id="sync" class="sync"></div>

<script>
/* ============ Utilidades ============ */
var S = { token: null, d: null, tab: 'inicio', dia: null, sub: {}, view: null };
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
// La sesión se guarda dos veces (almacenamiento + cookie): si el teléfono borra uno, queda el otro
function ck(k, v){ try { if (v === undefined) { var m = document.cookie.match(new RegExp('(?:^|; )jaf_' + k + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : null; }
  document.cookie = 'jaf_' + k + '=' + (v ? encodeURIComponent(v) : '') + ';path=/;max-age=' + (v ? 34560000 : 0) + ';SameSite=Lax' + (location.protocol === 'https:' ? ';Secure' : ''); } catch (e) { return null; } }
function getTok(){ var t = ls('token') || ck('t'); if (t && !ls('token')) ls('token', t); return t; }
function setTok(t){ ls('token', t); ck('t', t); if (t) try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {} }
function standalone(){ try { return navigator.standalone || matchMedia('(display-mode: standalone)').matches; } catch (e) { return false; } }
function enApp(){ return /Instagram|FBAN|FBAV|WhatsApp|Line\/|TikTok|musical_ly|Snapchat/i.test(navigator.userAgent || ''); }
function esIOS(){ return /iPhone|iPad|iPod/i.test(navigator.userAgent || '') || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function ls(k, v){ try { if (v === undefined) return JSON.parse(localStorage.getItem('jaf_' + k)); if (v === null) localStorage.removeItem('jaf_' + k); else localStorage.setItem('jaf_' + k, JSON.stringify(v)); } catch (e) { return null; } }
// La app funciona igual desde el enlace de Google (google.script.run) o desde su enlace propio (fetch al mismo servidor).
// Desde el enlace propio no se mandan las cuentas de Google del navegador, así no falla con varias cuentas abiertas.
var EXEC = 'https://script.google.com/macros/s/AKfycbw3OCst-xDMQ3-GMWoArIE4f56Ut9xmIR9NzqK-MTveg8xQhREZkBFtpEhsuZquTpWBYA/exec';
var GAS = !!(window.google && google.script && google.script.run);
function api(fn){ var args = [].slice.call(arguments, 1);
  if (GAS) return new Promise(function(ok, ko){ google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn].apply(null, args); });
  return fetch(EXEC, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', redirect: 'follow' })
    .then(function(r){ return r.json(); }).then(function(j){ if (!j.ok) throw new Error(j.e || 'Error'); return j.r; });
}
function toast(t, ms){ var e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(function(){ e.remove(); }, ms || 2600); }
function vib(p){ try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
function wa(text){ var n = S.d && S.d.config.whatsapp; return n ? 'https://wa.me/' + n + (text ? '?text=' + encodeURIComponent(text) : '') : '#'; }

/* Caritas */
function face(level, color, opts){
  opts = opts || {}; var m = {
    1:'<path d="M20 47 Q32 35 44 47" fill="none"/>', 2:'<path d="M22 45 Q32 40 42 45" fill="none"/>', 3:'<path d="M22 43 L42 43" fill="none"/>',
    4:'<path d="M21 40 Q32 49 43 40" fill="none"/>', 5:'<path d="M18 38 Q32 55 46 38 Z" fill="#fff"/>',
    hard:'<path d="M20 44 L44 44 L40 40 L24 40 Z" fill="#fff"/>', max:'<path d="M19 46 L45 46 L41 38 L23 38 Z" fill="#fff"/>'
  };
  var eyes = opts.squint ? '<path d="M18 24 L27 28 L18 31" fill="none"/><path d="M46 24 L37 28 L46 31" fill="none"/>' : '<circle cx="23" cy="27" r="3.5" fill="#000" stroke="none"/><circle cx="41" cy="27" r="3.5" fill="#000" stroke="none"/>';
  var brows = opts.brows ? '<path d="M16 18 L28 21"/><path d="M48 18 L36 21"/>' : '';
  var tear = opts.tear ? '<path d="M18 32 Q21 38 18 40 Q15 38 18 32 Z" fill="#5BA8FF" stroke-width="1.2"/>' : '';
  var sweat = opts.sweat ? '<path d="M54 8 Q58 15 54 18 Q50 15 54 8 Z" fill="#5BA8FF" stroke-width="1.5"/>' : '';
  return '<svg viewBox="0 0 64 64" width="' + (opts.size || 72) + '" height="' + (opts.size || 72) + '" aria-hidden="true" style="flex-shrink:0"><g stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="29" fill="' + color + '" stroke-width="2.5"/>' + eyes + brows + (m[level] || m[3]) + tear + sweat + '</g></svg>';
}
var RPE = {
  5:{c:'#9EAAB1',t:'SUAVE',m:'Te sobraban muchas reps. Puedes subir peso.',f:5},
  6:{c:'#C9E3FF',t:'CÓMODO',m:'Te quedaban 4 reps.',f:4},
  7:{c:'#FFDE59',t:'EXIGENTE',m:'Te quedaban 3 reps. Esto ya cuenta.',f:3},
  8:{c:'#F7A23B',t:'INTENSO',m:'Te quedaban 2 reps. Aquí es donde se crece.',f:2,o:{brows:true}},
  9:{c:'#E8552A',t:'MUY DURO',m:'Solo 1 rep más. Las piernitas de pollo tiemblan.',f:'hard',o:{squint:true,brows:true,sweat:true},w:1},
  10:{c:'#BC0F0C',t:'AL LÍMITE',m:'No salía ni una más.',f:'max',o:{squint:true,sweat:true},w:1}
};
var SCALE5 = ['#F09A96','#F4C7C3','#FCE8A6','#D9EAD3','#93C47D'];
var ICONS = {
  inicio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  entreno:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>',
  dieta:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-3 4-3 7h3v11"/></svg>',
  progreso:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M5 15l4-4 3 3 6-7"/></svg>',
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>',
  play:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  book:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h6M8 11h6"/></svg>',
  cam:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3z"/></svg>'
};

/* ============ Cola sin conexión ============ */
var Q = { busy: false };
// La cola de envíos vive en memoria (y se copia en el móvil por si se cierra la app)
function cola(){ if (!Q.list) Q.list = ls('q') || []; return Q.list; }
function guardarCola(){ ls('q', Q.list); pintarSync(); }
// Indicador: cuántos registros faltan por llegar a la hoja del coach
function pintarSync(){
  var el = $('sync'); if (!el) return; var n = cola().length; clearTimeout(pintarSync.t);
  if (n) { el.className = 'sync p'; el.textContent = '☁︎ ' + n + ' por enviar'; }
  else if (el.className === 'sync p') { el.className = 'sync ok'; el.textContent = '✓ Todo guardado'; pintarSync.t = setTimeout(function(){ el.className = 'sync'; }, 2500); }
}
function encolar(op){ cola().push(op); guardarCola(); flush(); }
function flush(){
  if (Q.busy) return; var q = cola(); if (!q.length) return;
  Q.busy = true; var id = Q.id = (Q.id || 0) + 1;
  // Si el iPhone corta el envío (por ejemplo al salir a WhatsApp), a los 25 s se reintenta
  setTimeout(function(){ if (Q.busy && Q.id === id) { Q.busy = false; flush(); } }, 25000);
  api('guardar', S.token, q[0]).then(function(){
    if (Q.id !== id) return;
    var r = cola(); r.shift(); guardarCola(); Q.busy = false;
    if (!r.length) { if (S.recargar) { S.recargar = false; cargar(); } } flush();
  }).catch(function(e){
    if (Q.id !== id) return;
    Q.busy = false;
    if (String(e).indexOf('SESION') >= 0) return salir();
    pintarSync();
    setTimeout(flush, 15000);
  });
}
window.addEventListener('online', flush);
window.addEventListener('load', function(){ pintarSync(); });
// Al volver a la app (desde otra app o la pantalla de inicio) se recargan los datos: así aparece la semana nueva sin cerrarla
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState !== 'visible' || !S.token || !S.d) return;
  if (cola().length) { Q.busy = false; flush(); return; }   // primero se envía lo pendiente
  if (Date.now() - (S.cargado || 0) > 30000) cargar();
});

/* ============ Arranque ============ */
function init(){
  // La llave de sesión también vive en el enlace (?k=...): así el icono de la pantalla de inicio entra sin código
  var usar = function(P){ P = P || {}; S.demo = P.demo || ''; if (P.k && !getTok()) setTok(P.k); arrancar(); };
  if (!GAS) { var P = {}; try { new URLSearchParams(location.search).forEach(function(v, k){ P[k] = v; }); } catch (e) {} return usar(P); }
  try { google.script.url.getLocation(function(loc){ usar(loc && loc.parameter); }); }
  catch (e) { arrancar(); }
}
function fijarUrl(){ try { var q = S.token ? { k: S.token } : {}; if (S.token && S.demo) q.demo = S.demo;
  if (GAS) return google.script.history.replace(null, q);
  var s = new URLSearchParams(q).toString(); history.replaceState(null, '', location.pathname + (s ? '?' + s : '')); } catch (e) {} }
function arrancar(){
  S.token = getTok();
  if (S.token && !ck('t')) ck('t', S.token);
  if (!S.token) return login();
  // Lo guardado en el teléfono se muestra mientras llega lo nuevo, salvo datos de prueba o de bienvenida (pueden ser viejos)
  var cache = S.demo ? null : ls('datos'); if (cache && !cache.demo && !cache.nuevo) { S.d = cache; render(); }
  cargar();
}
// Lo que aún está en la cola se vuelve a marcar como hecho al recargar, para que nada "desaparezca"
function aplicarPendientes(d){
  var sem = d && d.semana; if (!sem) return;
  cola().forEach(function(op){
    var key = sem.eval ? 'EVAL' : String(sem.n); if (op.semana !== key) return;
    var dia = (sem.dias || []).find(function(x){ return x.n === op.dia; }); if (!dia) return;
    if (op.tipo === 'serie') dia.ejercicios.forEach(function(e){ if (e.fila === op.fila && e.series[op.serie - 1]) e.series[op.serie - 1].hecho = { reps: op.reps, kg: op.kg, rpe: op.rpe }; });
    if (op.tipo === 'cierre') { dia.cerrado = dia.hecho = true; }
  });
}
function cargar(){
  return api('cargar', S.token, S.demo || '').then(function(d){ aplicarPendientes(d); S.d = d; S.cargado = Date.now(); if (!d.demo) ls('datos', d); fijarUrl(); render(); flush(); })
    .catch(function(e){ if (String(e).indexOf('SESION') >= 0) return salir(); if (!S.d) $('app').innerHTML = '<div class="empty">No hay conexión. Vuelve a intentarlo.<br><br><button class="btn y" onclick="cargar()">REINTENTAR</button></div>'; });
}
function salir(){ setTok(null); ls('datos', null); S.token = null; S.d = null; fijarUrl(); login(); }

/* ============ Acceso ============ */
function login(step, email){
  $('ovl').innerHTML = '';
  var h = '<div class="pad" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center">' +
    '<div style="flex:1"></div><b style="font-family:Anton;font-size:110px;font-weight:400;line-height:.9;letter-spacing:-4px">JA</b>' +
    '<div style="font-family:Anton;font-size:16px;letter-spacing:3px;color:var(--gr);margin-top:8px">MÉTODO JAF · PROGRAMA 1:1</div>' +
    '<div style="width:150px;height:2px;margin-top:16px;background:var(--am);box-shadow:0 0 12px var(--am)"></div><div style="flex:1"></div>';
  if (step === 'code') {
    h += '<p class="muted" style="margin:0 0 12px">Escribe el código de 6 cifras que te llegó a<br><b style="color:#fff">' + esc(email) + '</b></p>' +
      '<input id="code" class="in" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="letter-spacing:8px;font-size:26px">' +
      '<button class="btn y" style="margin-top:12px" onclick="verificar(\'' + esc(email) + '\')">ENTRAR</button>' +

/* Días de la semana del esquema semanal: el Día 1 va al 1er día con fuerza, el Día 2 al 2º, etc. */
var DSEM = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];
function hoyIdx(){ return (new Date().getDay() + 6) % 7; }
function planDias(){
  var c = S.d.cardio || [], s = S.d.semana, dias = (s.dias || []).slice().sort(function(a, b){ return a.n - b.n; }), plan = {};
  var ent = c.filter(function(x){ var f = String(x.fuerza || '').trim(); return f && !/descanso|^-+$/i.test(f); }).map(function(x){ return x.i; });
  if (!ent.length) return plan;
  dias.forEach(function(d, k){ if (k < ent.length) plan[d.n] = ent[k]; });
  return plan;
}
function diaDeHoy(){ var p = planDias(), h = hoyIdx(); for (var n in p) if (p[n] === h) return +n; return null; }
function diaActual(){
  var s = S.d.semana, n = S.dia;
  if (!n) { var t = diaDeHoy(), dt = t && s.dias.find(function(x){ return x.n === t; }); n = dt && !dt.hecho ? t : (s.siguiente || (s.dias[0] && s.dias[0].n)); }
  return s.dias.find(function(x){ return x.n === n; }) || s.dias[0];
}

  return '<div class="card" style="margin-bottom:12px;font-size:13px">📅 Este entreno está pautado para el <b>' + DSEM[p[d.n]] + '</b>.</div>';

// Lo escrito y sin guardar se conserva en el teléfono aunque se cierre la app
function claveBorr(i){ return 'bd_' + (S.d.semana.sid || '') + S.d.semana.hoja + '_' + E.dia + '_' + i; }
function persistir(i){ var o = {}, n = 0; Object.keys(E.draft || {}).forEach(function(x){ if (x.split('_')[0] === String(i)) { o[x] = E.draft[x]; n++; } }); ls(claveBorr(i), n ? o : null); }
document.addEventListener('input', function(ev){ if (S.view === vEj && ev.target && /^(reps|kg|ir\d|ik\d)$/.test(ev.target.id)) guardarBorrador(); });
function guardarBorrador(){
  if (S.view !== vEj || E.rs == null || !$('reps')) return;
  var k = E.ri + '_' + E.rs, b = E.draft[k] || {};
  b.reps = $('reps').value; b.kg = $('kg').value; if (E.rpe != null) b.rpe = E.rpe;
  b.ir = []; b.ik = []; for (var p = 0; p < 5; p++) { var r = $('ir' + p), g = $('ik' + p); if (r) { b.ir[p] = r.value; b.ik[p] = g.value; } }
  E.draft[k] = b; persistir(E.ri);
}
var DESC = 120; // descanso por defecto; si el coach puso PAUSA en Programación, se usa esa
function descEj(){ var d = S.d.semana.dias.find(function(x){ return x.n === E.dia; }), e = d && d.ejercicios[E.i]; return (e && e.pausa) || DESC; }
function mmss(t){ return Math.floor(t / 60) + ':' + ('0' + t % 60).slice(-2); }
function cambiarSerie(k, campo){ guardarBorrador();
  var dAct = E.draft[E.i + '_' + E.s];
  if (k > E.s && dAct && String(dAct.reps || '').trim() && !T.t) descanso(descEj()); if (k !== E.s) { E.s = k; E.rpe = null; render(); } var x = $(campo || 'reps'); if (x && campo) { x.focus(); try { x.select(); } catch (e) {} } }
// Un solo GUARDAR: guarda todas las series que tengan repeticiones escritas y pasa al siguiente ejercicio
function hecho(){
  guardarBorrador();
  var s = S.d.semana, d = s.dias.find(function(x){ return x.n === E.dia; }), e = d.ejercicios[E.i], n = 0;
  e.series.forEach(function(se, k){
    var b = E.draft[E.i + '_' + k]; if (!b) return;
    var reps = String(b.reps || '').trim(), kg = String(b.kg || '').trim(); if (!reps) return;
    var rpe = b.rpe || (se.hecho && parseInt(se.hecho.rpe, 10)) || parseInt(se.rpe, 10) || 7;
    if (se.hecho && se.hecho.reps === reps && se.hecho.kg === kg && parseInt(se.hecho.rpe, 10) === rpe && !(b.ir || []).some(String)) { delete E.draft[E.i + '_' + k]; return; }
    var intens = []; (b.ir || []).forEach(function(r, p){ if (r || (b.ik || [])[p]) intens.push({ reps: r, kg: (b.ik || [])[p] || '' }); });
    se.hecho = { reps: reps, kg: kg, rpe: rpe }; delete E.draft[E.i + '_' + k]; n++;
    encolar({ tipo: 'serie', hoja: s.hoja, semana: s.eval ? 'EVAL' : String(s.n), dia: E.dia, fila: e.fila, ejercicio: e.nombre, serie: se.n, reps: reps, kg: kg, rpe: rpe, intens: intens });
  });
  var falta = e.series.findIndex(function(x){ return !x.hecho; });
  E.rs = null; persistir(E.i);
  if (!n && falta >= 0) { toast('Escribe las repeticiones'); var x = $('reps'); if (x) x.focus(); return; }
  ls('datos', S.d); vib(30);
  if (falta >= 0) { toast('✓ Guardado · te falta la serie ' + e.series[falta].n); E.s = falta; E.rpe = null; return render(); }
  // Ejercicio completo: pasa solo al siguiente que tenga series pendientes
  var pend = function(j){ return d.ejercicios[j].series.some(function(z){ return !z.hecho; }); }, sig = -1, j;
  for (j = E.i + 1; j < d.ejercicios.length && sig < 0; j++) if (pend(j)) sig = j;
  for (j = 0; j < E.i && sig < 0; j++) if (pend(j)) sig = j;
  if (sig < 0) { saltar(); S.view = null; toast('✓ ¡Todos los ejercicios listos! Termina el entreno abajo'); render(); return arriba(); }
  toast('✓ ' + e.nombre + ' guardado · siguiente ejercicio');
  var pPrev = descEj(); abrirEj(E.dia, sig, true);
  descanso(pPrev);
}

/* ---------- Descanso ---------- */
var T = { t: null, left: 0, total: 0 };
function descanso(sec){ clearInterval(T.t); T.left = T.total = sec; T.fin = Date.now() + sec * 1000; pintarDescanso();
  T.t = setInterval(function(){ T.left = Math.round((T.fin - Date.now()) / 1000); if (T.left <= 0) { clearInterval(T.t); T.t = null; vib([300, 150, 300]); quitarDescanso(); toast('¡A por la siguiente serie!'); } else pintarDescanso(); }, 500); }
function quitarDescanso(){ $('ovl').innerHTML = ''; document.body.classList.remove('contmr'); }
function ajustar(x){ T.left = Math.max(1, T.left + x); T.fin = Date.now() + T.left * 1000; T.total = Math.max(T.total, T.left); pintarDescanso(); }
function saltar(){ clearInterval(T.t); T.t = null; quitarDescanso(); }
function pintarDescanso(){
  // Barra compacta arriba: la pantalla se corre hacia abajo para que el ejercicio siga visible
  document.body.classList.add('contmr');
  var m = Math.floor(T.left / 60), s = T.left % 60, b = 'background:none;border:1px solid #4a6a99;color:#fff;border-radius:12px;height:38px;width:46px;font-weight:800;font-size:13px';
  $('ovl').innerHTML = '<div class="tmr"><div class="row" style="gap:8px;align-items:center">' +
    '<div class="grow"><div style="font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--am)">DESCANSO · SUGERIDO ' + mmss(T.total) + '</div><div style="font-family:Anton;font-size:28px;line-height:1">' + m + ':' + (s < 10 ? '0' : '') + s + '</div></div>' +
    '<button style="' + b + '" onclick="ajustar(-15)">−15</button><button style="' + b + '" onclick="ajustar(15)">+15</button>' +
    '<button class="btn y" style="width:auto;height:38px;padding:0 12px;font-size:12px;flex-shrink:0" onclick="saltar()">Empezar ya</button></div>' +
    '<div class="bar" style="margin:6px 0 0;height:4px"><i style="width:' + Math.round(T.left / T.total * 100) + '%"></i></div></div>';
}

/* ---------- Cierre del día ---------- */
var C = {};
// Resumen corto al cerrar el día: en qué ejercicios subió de peso respecto a la semana pasada
function resumenDia(d){
  var num = function(x){ return parseFloat(String(x || '').replace(',', '.')) || 0; }, mej = [];
  d.ejercicios.forEach(function(e){
    var hoy = 0, ant = 0;
    e.series.forEach(function(s){ if (s.hecho) hoy = Math.max(hoy, num(s.hecho.kg)); if (s.ant) ant = Math.max(ant, num(s.ant.kg)); });
    if (ant && hoy > ant) mej.push(e.nombre.split(/ - | \(/)[0] + ' +' + String(Math.round((hoy - ant) * 10) / 10).replace('.', ','));
  });
  if (!mej.length) return '💪 ¡Buen trabajo! Entreno guardado.';
  return '💪 ¡Buen trabajo! Subiste en ' + (mej.length > 2 ? mej.length + ' ejercicios: ' + mej.slice(0, 2).join(', ') + '…' : mej.join(', '));
}

// Reparte 1 intercambio (100 kcal) entre HC / P / G en cuartos, como en la hoja de Alimentos (p. ej. ¾ HC + ¼ P)
function cuartos(fr){
  var t = fr[0] + fr[1] + fr[2]; if (!(t > 0)) return [0, 0, 0];
  // Lo que aporta menos del 15 % no cuenta (como la grasa de la proteína de suero)
  fr = fr.map(function(v){ return v / t < 0.15 ? 0 : v; }); t = fr[0] + fr[1] + fr[2];
  var x = fr.map(function(v){ return v / t * 4; }), q = x.map(Math.round), d = 4 - q[0] - q[1] - q[2];
  while (d !== 0) {
    var k = 0, best = null;
    for (var i = 0; i < 3; i++) { var e = d > 0 ? x[i] - q[i] : q[i] - x[i]; if (d < 0 && q[i] === 0) continue; if (best === null || e > best) { best = e; k = i; } }
    q[k] += d > 0 ? 1 : -1; d += d > 0 ? -1 : 1;
  }
  return q;
}
function equivale(q){
  var F = ['', '¼', '½', '¾', '1'], L = ['HC', 'P', 'G'];
  return q.map(function(n, i){ return n ? F[n] + ' ' + L[i] : ''; }).filter(String).join(' + ');
}
function calc(){
  var v = [0,1,2,3].map(function(i){ return parseFloat(($('c' + i).value || '').replace(',', '.')); });
  if (!(v[0] > 0)) return $('calcR').innerHTML = '';
  var g = 10000 / v[0], f = g / 100, hc = (v[1] || 0) * f * 4 / 100, p = (v[2] || 0) * f * 4 / 100, gr = (v[3] || 0) * f * 9 / 100;
  var arr = [['HC', hc, '#000'], ['Proteína', p, '#BC0F0C'], ['Grasa', gr, '#002F6C']];
  var q = cuartos([hc, p, gr]), puro = q.indexOf(4), eq = equivale(q);
  var titulo = puro >= 0 ? '= 1 intercambio de ' + ['hidratos', 'proteína', 'grasa'][puro] : '= 1 intercambio mixto';
  $('calcR').innerHTML = '<div style="margin-top:14px;border-radius:24px;background:var(--am);color:#000;padding:18px"><div style="font-size:12px;font-weight:800;letter-spacing:1.5px">RESULTADO</div>' +

    (eq ? '<div style="margin-top:8px;background:#000;color:var(--am);border-radius:14px;padding:10px 12px;font-weight:800;font-size:15px">CUÉNTALO COMO: ' + eq + '</div>' : '') +
    arr.map(function(a){ return '<div class="row" style="gap:8px;margin-top:6px"><span style="width:62px;font-size:12px;font-weight:700">' + a[0] + '</span><div class="grow bar" style="background:rgba(0,0,0,.15)"><i style="background:' + a[2] + ';width:' + Math.min(100, Math.round(a[1] * 100)) + '%"></i></div><b style="width:36px;text-align:right;font-size:12px">' + a[1].toFixed(2).replace('.', ',') + '</b></div>'; }).join('') +
    '<div style="font-size:12px;margin-top:8px">' + Math.round(g) + ' g exactos de producto.</div></div>';

  h += '<div class="pad">';
  if (pend) h += '<button class="btn y" style="margin:6px 0 4px" onclick="S.ci=true;render();arriba()">' + (CI.i ? 'CONTINUAR' : 'HACER') + ' CHECK-IN · SEMANA ' + s.n + '</button>';
  else if (S.d.checkinHecho && s.n) h += '<div class="card" style="text-align:center;margin-top:6px"><b style="color:var(--ok)">✓ Check-in de la Semana ' + s.n + ' enviado</b><div class="muted" style="font-size:13px;margin-top:4px">Tu coach lo revisará para tu semana nueva.</div></div>';
  return h + vGraficas() + '</div>';
}

/* ---------- Progreso: gráficas (peso, % grasa, tren inferior) de todos los bloques ---------- */
var PG = null;
function cargarProgreso(){
  api('progreso', S.token).then(function(r){ PG = r; ls('prog', r); if (S.tab === 'progreso' && !S.ci) render(); })
    .catch(function(){ S.pgError = true; if (S.tab === 'progreso' && !S.ci) render(); });
}
function vGraficas(){
  if (!PG) PG = ls('prog');
  if (!S.pgPedido) { S.pgPedido = true; cargarProgreso(); }
  if (!PG) return '<div class="empty">' + (S.pgError ? 'No se pudo cargar tu progreso. Vuelve a intentarlo más tarde.' : 'Cargando tu progreso…') + '</div>';
  if (!(PG.pts || []).length) return '<div class="empty">Aquí verás tu peso, tu % de grasa y tu tren inferior en cuanto tengas tus primeras medidas.</div>';
  return grafica('PESO', 'kg', [{ k: 'peso', c: '#FFDE59' }], 0) +
    grafica('% DE GRASA', '%', [{ k: 'grasa', c: '#FF6B6B' }], -1) +
    grafica('TREN INFERIOR · MUSLO', 'cm', [{ k: 'muslo', c: '#93C47D', n: 'Muslo (promedio der. e izq.)' }], 1) +
    grafica('TREN INFERIOR · GEMELO', 'cm', [{ k: 'gemelo', c: '#4FA3E0', n: 'Gemelo (promedio der. e izq.)' }], 1) +
    '<p class="muted" style="font-size:12px;text-align:center;margin:12px 0 24px">El cambio se mide desde tu primer registro. El % de grasa es una estimación con la fórmula Navy (cuello, cintura' + (/mujer/i.test(PG.sexo) ? ', cadera' : '') + ' y altura).</p>';
}
function fmt1(v){ return String(Math.round(v * 10) / 10).replace('.', ','); }
function semTxt(s){ return s === 0 ? 'Inicio' : 'Semana ' + s; }
function grafica(t, u, ser, mejor){
  var P = PG.pts, W = 320, H = 150, L = 34, R = 10, T = 12, B = 24, all = [];
  ser.forEach(function(x){ P.forEach(function(p){ if (p[x.k] != null) all.push(p[x.k]); }); });
  if (!all.length) return '';
  var xs = P.filter(function(p){ return ser.some(function(x){ return p[x.k] != null; }); }).map(function(p){ return p.s; });
  var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs); if (x1 === x0) x1 = x0 + 1;
  var y0 = Math.min.apply(null, all), y1 = Math.max.apply(null, all), pd = (y1 - y0) * 0.15 || 1; y0 -= pd; y1 += pd;
  var X = function(s){ return (L + (s - x0) / (x1 - x0) * (W - L - R)).toFixed(1); }, Y = function(v){ return (T + (1 - (v - y0) / (y1 - y0)) * (H - T - B)).toFixed(1); };
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;display:block">';
  for (var i = 0; i <= 2; i++) { var v = y0 + (y1 - y0) * (i + 0.5) / 3, yy = Y(v); svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="#262626"/><text x="' + (L - 5) + '" y="' + (+yy + 3) + '" fill="#9EAAB1" font-size="9" text-anchor="end">' + fmt1(v) + '</text>'; }
  svg += '<text x="' + L + '" y="' + (H - 6) + '" fill="#9EAAB1" font-size="9">' + semTxt(x0) + '</text><text x="' + (W - R) + '" y="' + (H - 6) + '" fill="#9EAAB1" font-size="9" text-anchor="end">' + semTxt(x1) + '</text>';
  var cab = '';
  ser.forEach(function(x){
    var pts = P.filter(function(p){ return p[x.k] != null; }); if (!pts.length) return;
    if (pts.length > 1) svg += '<polyline fill="none" stroke="' + x.c + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="' + pts.map(function(p){ return X(p.s) + ',' + Y(p[x.k]); }).join(' ') + '"/>';
    pts.forEach(function(p, i){ svg += '<circle cx="' + X(p.s) + '" cy="' + Y(p[x.k]) + '" r="' + (i === pts.length - 1 ? 4.5 : 2.5) + '" fill="' + x.c + '"/>'; });
    var a = pts[0][x.k], b = pts[pts.length - 1][x.k], d = Math.round((b - a) * 10) / 10;
    var col = (!d || !mejor) ? 'var(--gr)' : ((d > 0) === (mejor > 0) ? 'var(--ok)' : '#FF6B6B');
    cab += '<div style="margin-right:18px"><div class="muted" style="font-size:11px">' + (x.n || 'Ahora') + '</div><b style="font-family:Anton;font-weight:400;font-size:28px;color:' + x.c + '">' + fmt1(b) + '</b> <small class="muted">' + u + '</small> ' + (pts.length > 1 ? '<small style="color:' + col + ';font-weight:800">' + (d > 0 ? '+' : '') + fmt1(d) + '</small>' : '') + '</div>';
  });
  return '<div class="lbl">' + t + '</div><div class="card"><div class="row" style="flex-wrap:wrap;margin-bottom:6px">' + cab + '</div>' + svg + '</svg></div>';
}

function vCheckin(){
  var h = '', s = S.d.semana;
  var P = PREG[CI.i], last = CI.i === PREG.length - 1, v = CI.a[P.k];
  h += '<div class="pad"><div class="row muted" style="justify-content:space-between;font-weight:700;font-size:12px"><span>Pregunta ' + (CI.i + 1) + ' de ' + PREG.length + '</span><span>' + P.g + '</span></div><div class="bar" style="margin:8px 0 18px;background:#1f1f1f"><i style="width:' + Math.round((CI.i + 1) / PREG.length * 100) + '%"></i></div>';
  if (P.num) {
    h += '<h1 style="font-size:28px">' + P.l.toUpperCase() + '</h1>' + (P.hint ? '<p class="muted">' + P.hint + '</p>' : '') +
      '<div class="row" style="border-bottom:2px solid var(--am);margin-top:24px"><input id="numq" inputmode="decimal" value="' + esc(v || '') + '" style="flex:1;background:none;border:none;color:#fff;font-family:Anton;font-size:56px;outline:none;width:100%" oninput="CI.a.' + P.k + '=this.value"><b class="muted" style="font-size:18px">' + P.num + '</b></div>';
  } else if (P.orina) {
    var sel = v || 2, good = [5,5,5,4,3,2,1,1][sel - 1], txt = ['Hidratación','Hidratación','Hidratación','Deshidratación','Deshidratación','Deshidratación','Deshidratación severa','Deshidratación severa'][sel - 1];
    h += '<div class="row">' + face(good, ORINA[sel - 1], { size: 90, tear: good === 1 }) + '<h1 style="font-size:28px">' + P.l.toUpperCase() + '</h1></div>' +
      '<div class="card" style="margin-top:14px;background:' + ORINA[sel - 1] + ';color:#000;border:none"><b>' + txt + '</b></div>' +
      '<div class="scale" style="grid-template-columns:repeat(8,1fr);margin-top:14px">' + ORINA.map(function(c, i){ return '<button style="height:52px;color:#000;background:' + c + ';border-color:' + (sel === i + 1 ? '#fff' : 'transparent') + ';' + (sel === i + 1 ? '' : 'opacity:.55') + '" onclick="CI.a.hidratacion=' + (i + 1) + ';render()">' + (i + 1) + '</button>'; }).join('') + '</div>';
  } else {
    var sv = v || 3, lvl = P.t[sv - 1], good2 = P.mid ? [1,3,5,3,1][sv - 1] : sv, col = P.mid ? [SCALE5[0],SCALE5[2],SCALE5[4],SCALE5[2],SCALE5[0]][sv - 1] : SCALE5[sv - 1];
    h += '<div class="row">' + face(good2, col, { size: 90, tear: good2 === 1 }) + '<h1 style="font-size:28px">' + P.l.toUpperCase() + '</h1></div>' +
      '<div class="card" style="margin-top:14px;background:' + col + ';color:#000;border:none;min-height:86px"><b>' + lvl[0] + '</b><div style="font-size:14px;margin-top:4px">' + lvl[1] + '</div></div>' +
      '<div class="scale" style="grid-template-columns:repeat(5,1fr);margin-top:14px">' + [1,2,3,4,5].map(function(n){ var cc = P.mid ? [SCALE5[0],SCALE5[2],SCALE5[4],SCALE5[2],SCALE5[0]][n - 1] : SCALE5[n - 1]; return '<button style="height:52px;color:#000;background:' + cc + ';border-color:' + (sv === n ? '#fff' : 'transparent') + ';' + (sv === n ? '' : 'opacity:.55') + '" onclick="CI.a.' + P.k + '=' + n + ';render()">' + n + '</button>'; }).join('') + '</div>' +
      '<div class="row muted" style="justify-content:space-between;font-size:11px;margin-top:6px"><span>' + P.t[0][0] + '</span><span>' + P.t[4][0] + '</span></div>';
  }
  h += '<div class="row" style="margin-top:28px"><button class="ibtn" style="width:58px;height:56px;border-radius:28px" onclick="CI.i=Math.max(0,CI.i-1);render()">‹</button><button class="btn" onclick="sigPreg()">' + (last ? 'ENVIAR A MI COACH' : 'SIGUIENTE') + '</button></div></div>';
  return h;
}
function sigPreg(){
  var P = PREG[CI.i];
  if (P.num) { var x = $('numq').value.trim(); if (!x) return toast('Escribe un número'); CI.a[P.k] = x; }
  else if (CI.a[P.k] == null) CI.a[P.k] = P.orina ? 2 : 3;
  if (CI.i < PREG.length - 1) { CI.i++; return render(); }
  encolar({ tipo: 'checkin', semana: S.d.semana.n, respuestas: CI.a });
  S.d.checkinHecho = true; ls('datos', S.d); CI = { i: 0, a: {} }; S.ci = false; S.pgPedido = false; toast('¡Check-in enviado!'); go('inicio');
}

/* ---------- Recursos ---------- */
function vRecursos(){
  var R = S.d.recursos, h = '<div class="top"><button class="ibtn" onclick="go(\'inicio\')">' + ICONS.back + '</button><h1 style="font-size:26px">RECURSOS</h1><span style="width:44px"></span></div><div class="pad">';
  var grupos = [['Video','VIDEOS'],['Documento','DOCUMENTOS'],['Herramienta','HERRAMIENTAS'],['Pestaña','EN LA APP']];
  grupos.forEach(function(g){
    var L = R.filter(function(r){ return r.tipo === g[0]; }); if (!L.length) return;
    h += '<div class="lbl">' + g[1] + '</div>' + L.map(function(r){
      if (/^app:/i.test(r.enlace)) { var dest = r.enlace.slice(4).toLowerCase(); var tab = dest.indexOf('seguimiento') >= 0 ? 'progreso' : 'dieta'; return '<button class="ex" onclick="go(\'' + tab + '\'' + (tab === 'progreso' ? ',{ci:true}' : '') + ')"><div class="grow nm">' + esc(r.nombre) + '</div>›</button>'; }
      return '<a class="ex" style="text-decoration:none" href="' + esc(r.enlace) + '" target="_blank" rel="noopener">' + (g[0] === 'Video' ? '<div class="ic" style="width:36px;height:36px">' + ICONS.play + '</div>' : '') + '<div class="grow nm">' + esc(r.nombre) + '</div>›</a>';
    }).join('');
  });
  var w = S.d.config.whatsapp;
  h += '<div class="card" style="margin-top:18px"><div class="row muted" style="justify-content:space-between;font-weight:800;font-size:11px"><span>CONTACTO</span><span>' + esc(S.d.config.horario || '') + '</span></div>' +
    (w ? '<a class="btn g" style="display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:10px;height:48px" href="' + wa() + '" target="_blank" rel="noopener">WhatsApp</a>' : '') + '</div>' +
    '<button class="btn d" style="margin-top:24px;height:44px;font-size:13px" onclick="if(confirm(\'¿Cerrar sesión?\'))salir()">Cerrar sesión</button></div>';
  return h;
}

init();
</script>
